name: Build and publish Kodi repository

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a run mid-publish: an interrupted run could deploy
  # without tagging (or tag without bumping) and strand the pipeline
  cancel-in-progress: false

env:
  PLUGIN_ID: plugin.video.webshare
  REPO_ID: repository.mbystriansky

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate sources
        run: |
          # Syntax-check every Python file that ships; a broken default.py
          # must never reach auto-updating users
          python3 -m compileall -q default.py resources/lib
          # XML well-formedness of everything Kodi parses
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET
          for path in ('addon.xml',
                       'resources/settings.xml',
                       'repository.mbystriansky/addon.xml'):
              ET.parse(path)
              print(path, 'OK')
          PYEOF

      - name: Read addon versions
        id: versions
        run: |
          PLUGIN_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")
          REPO_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('${REPO_ID}/addon.xml').getroot().get('version'))")
          echo "plugin=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin: $PLUGIN_VERSION, Repo: $REPO_VERSION"

      - name: Verify tag does not yet exist
        run: |
          TAG="v${{ steps.versions.outputs.plugin }}"
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Bump addon.xml version manually before publishing again."
            exit 1
          fi
          echo "Tag ${TAG} is free, will be created after deploy."

      - name: Build plugin ZIP
        run: |
          BUILD=$(mktemp -d)
          mkdir -p "$BUILD/${PLUGIN_ID}"
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='*.md' \
            --exclude='dist' \
            --exclude='.gitignore' \
            --exclude="${REPO_ID}" \
            ./ "$BUILD/${PLUGIN_ID}/"
          mkdir -p "dist/${PLUGIN_ID}"
          (cd "$BUILD" && zip -r "$GITHUB_WORKSPACE/dist/${PLUGIN_ID}/${PLUGIN_ID}-${{ steps.versions.outputs.plugin }}.zip" "${PLUGIN_ID}")

      - name: Build repository ZIP
        run: |
          mkdir -p "dist/${REPO_ID}"
          zip -r "dist/${REPO_ID}/${REPO_ID}-${{ steps.versions.outputs.repo }}.zip" "${REPO_ID}"

      - name: Generate addons.xml + checksum
        run: |
          python3 <<'PYEOF'
          import hashlib
          import os
          import xml.etree.ElementTree as ET

          repo_id = os.environ['REPO_ID']
          root = ET.Element('addons')
          for path in ('addon.xml', f'{repo_id}/addon.xml'):
              root.append(ET.parse(path).getroot())
          ET.indent(root)
          xml = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
                 + ET.tostring(root, encoding='unicode'))
          with open('dist/addons.xml', 'w', encoding='utf-8') as f:
              f.write(xml)
          md5 = hashlib.md5(xml.encode('utf-8')).hexdigest()
          with open('dist/addons.xml.md5', 'w', encoding='utf-8') as f:
              f.write(md5)
          print('addons.xml generated, md5:', md5)
          PYEOF

      - name: Generate index.html files
        run: |
          # Root index.html — user-facing landing page
          cat > dist/index.html <<EOF
          <!DOCTYPE html>
          <html lang="sk">
          <head>
            <meta charset="utf-8">
            <title>mbystriansky Kodi Repository</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
                     max-width: 760px; margin: 3em auto; padding: 0 1em; line-height: 1.55; color: #1f2937; }
              h1 { border-bottom: 2px solid #eee; padding-bottom: .3em; }
              h2 { margin-top: 2em; }
              code { background: #f3f4f6; padding: .15em .4em; border-radius: 3px; font-size: .9em; }
              .url { display: block; background: #f3f4f6; padding: .6em 1em; border-radius: 4px; font-family: monospace; word-break: break-all; margin: .5em 0; }
              ol li { margin: .5em 0; }
              .note { background: #fef3c7; border-left: 3px solid #f59e0b; padding: .8em 1em; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>mbystriansky Kodi Repository</h1>
            <p>Repozitár Kodi addonov s automatickými aktualizáciami.</p>

            <h2>Inštalácia priamo z URL v Kodi</h2>
            <ol>
              <li><strong>Settings → System → Add-ons</strong> → zapni <em>Unknown sources</em></li>
              <li><strong>Settings → File manager → Add source</strong> → vlož URL:
                <span class="url">https://mbystriansky.github.io/webshare/</span>
                Pomenuj zdroj napr. <code>mbystriansky</code></li>
              <li><strong>Add-ons → Install from zip file → mbystriansky → ${REPO_ID} → ${REPO_ID}-${{ steps.versions.outputs.repo }}.zip</strong></li>
              <li><strong>Install from repository → mbystriansky Repository → Video add-ons → Webshare.cz → Install</strong></li>
            </ol>
            <div class="note">
              Po inštalácii repository bude Kodi <strong>automaticky aktualizovať</strong> plugin pri každom novom buildi.
            </div>

            <h2>Obsah repozitára</h2>
            <ul>
              <li><a href="${PLUGIN_ID}/">${PLUGIN_ID}/</a> — Webshare.cz v${{ steps.versions.outputs.plugin }}</li>
              <li><a href="${REPO_ID}/">${REPO_ID}/</a> — Repository v${{ steps.versions.outputs.repo }}</li>
            </ul>

            <h2>Manifest</h2>
            <p>
              <a href="addons.xml">addons.xml</a> |
              <a href="addons.xml.md5">addons.xml.md5</a>
            </p>

            <p><small><a href="https://github.com/mbystriansky/webshare">Zdrojový kód na GitHube</a></small></p>
          </body>
          </html>
          EOF

          # Per-subfolder index.html — simple Kodi-parseable listing
          for dir in "${PLUGIN_ID}" "${REPO_ID}"; do
            cat > "dist/${dir}/index.html" <<HTMLEOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Index of /${dir}/</title></head>
          <body>
          <h1>Index of /${dir}/</h1>
          <hr><pre>
          <a href="../">../</a>
          HTMLEOF
            # Add each ZIP as a link (filename only — relative to this folder)
            (cd "dist/${dir}" && for f in *.zip; do
              [ -f "$f" ] && echo "<a href=\"$f\">$f</a>" >> "index.html"
            done)
            echo "</pre><hr></body></html>" >> "dist/${dir}/index.html"
          done

      - name: List dist contents
        run: find dist -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Git bookkeeping runs only after a successful deploy, so a failed
  # push can never block the publish or strand a tag pointing at an
  # undeployed version.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag released version
        id: tag
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="v${VERSION}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Bump patch version in addon.xml
        run: |
          python3 <<'PYEOF'
          import re
          import xml.etree.ElementTree as ET
          path = 'addon.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          current = ET.parse(path).getroot().get('version')
          parts = current.split('.')
          parts[-1] = str(int(parts[-1]) + 1)
          new_version = '.'.join(parts)
          # Replace only the addon's version attribute (first match), preserving formatting
          new_content = re.sub(
              r'(<addon\b[^>]*\bversion=")[^"]+(")',
              r'\g<1>' + new_version + r'\g<2>',
              content,
              count=1,
          )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(new_content)
          print(f'Bumped {current} -> {new_version}')
          PYEOF
          git add addon.xml
          git commit -m "Bump addon version after v${{ steps.tag.outputs.version }} release"
          git push
