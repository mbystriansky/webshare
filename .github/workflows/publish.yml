name: Build and publish Kodi repository

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PLUGIN_ID: plugin.video.webshare
  REPO_ID: repository.mbystriansky

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read addon versions
        id: versions
        run: |
          PLUGIN_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")
          REPO_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('${REPO_ID}/addon.xml').getroot().get('version'))")
          echo "plugin=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin: $PLUGIN_VERSION, Repo: $REPO_VERSION"

      - name: Build plugin ZIP
        run: |
          BUILD=$(mktemp -d)
          mkdir -p "$BUILD/${PLUGIN_ID}"
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='CLAUDE.md' \
            --exclude='.gitignore' \
            --exclude="${REPO_ID}" \
            ./ "$BUILD/${PLUGIN_ID}/"
          mkdir -p "dist/${PLUGIN_ID}"
          (cd "$BUILD" && zip -r "$GITHUB_WORKSPACE/dist/${PLUGIN_ID}/${PLUGIN_ID}-${{ steps.versions.outputs.plugin }}.zip" "${PLUGIN_ID}")

      - name: Build repository ZIP
        run: |
          mkdir -p "dist/${REPO_ID}"
          zip -r "dist/${REPO_ID}/${REPO_ID}-${{ steps.versions.outputs.repo }}.zip" "${REPO_ID}"

      - name: Generate addons.xml + checksum
        run: |
          python3 <<'PYEOF'
          import xml.etree.ElementTree as ET
          import hashlib
          import os
          plugin_id = os.environ['PLUGIN_ID']
          repo_id = os.environ['REPO_ID']
          out = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', '<addons>']
          for addon_dir, path in [(plugin_id, 'addon.xml'), (repo_id, f'{repo_id}/addon.xml')]:
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              # Strip XML declaration to embed inside <addons>
              if content.startswith('<?xml'):
                  content = content.split('?>', 1)[1].lstrip()
              out.append(content.rstrip())
          out.append('</addons>')
          xml = '\n'.join(out)
          with open('dist/addons.xml', 'w', encoding='utf-8') as f:
              f.write(xml)
          md5 = hashlib.md5(xml.encode('utf-8')).hexdigest()
          with open('dist/addons.xml.md5', 'w', encoding='utf-8') as f:
              f.write(md5)
          print('addons.xml generated, md5:', md5)
          PYEOF

      - name: Generate index.html files
        run: |
          # Root index.html — user-facing landing page
          cat > dist/index.html <<EOF
          <!DOCTYPE html>
          <html lang="sk">
          <head>
            <meta charset="utf-8">
            <title>mbystriansky Kodi Repository</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
                     max-width: 760px; margin: 3em auto; padding: 0 1em; line-height: 1.55; color: #1f2937; }
              h1 { border-bottom: 2px solid #eee; padding-bottom: .3em; }
              h2 { margin-top: 2em; }
              code { background: #f3f4f6; padding: .15em .4em; border-radius: 3px; font-size: .9em; }
              .url { display: block; background: #f3f4f6; padding: .6em 1em; border-radius: 4px; font-family: monospace; word-break: break-all; margin: .5em 0; }
              ol li { margin: .5em 0; }
              .note { background: #fef3c7; border-left: 3px solid #f59e0b; padding: .8em 1em; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>mbystriansky Kodi Repository</h1>
            <p>Repozitár Kodi addonov s automatickými aktualizáciami.</p>

            <h2>Inštalácia priamo z URL v Kodi</h2>
            <ol>
              <li><strong>Settings → System → Add-ons</strong> → zapni <em>Unknown sources</em></li>
              <li><strong>Settings → File manager → Add source</strong> → vlož URL:
                <span class="url">https://mbystriansky.github.io/webshare/</span>
                Pomenuj zdroj napr. <code>mbystriansky</code></li>
              <li><strong>Add-ons → Install from zip file → mbystriansky → ${REPO_ID} → ${REPO_ID}-${{ steps.versions.outputs.repo }}.zip</strong></li>
              <li><strong>Install from repository → mbystriansky Repository → Video add-ons → Webshare.cz → Install</strong></li>
            </ol>
            <div class="note">
              Po inštalácii repository bude Kodi <strong>automaticky aktualizovať</strong> plugin pri každom novom buildi.
            </div>

            <h2>Obsah repozitára</h2>
            <ul>
              <li><a href="${PLUGIN_ID}/">${PLUGIN_ID}/</a> — Webshare.cz v${{ steps.versions.outputs.plugin }}</li>
              <li><a href="${REPO_ID}/">${REPO_ID}/</a> — Repository v${{ steps.versions.outputs.repo }}</li>
            </ul>

            <h2>Manifest</h2>
            <p>
              <a href="addons.xml">addons.xml</a> |
              <a href="addons.xml.md5">addons.xml.md5</a>
            </p>

            <p><small><a href="https://github.com/mbystriansky/webshare">Zdrojový kód na GitHube</a></small></p>
          </body>
          </html>
          EOF

          # Per-subfolder index.html — simple Kodi-parseable listing
          for dir in "${PLUGIN_ID}" "${REPO_ID}"; do
            cat > "dist/${dir}/index.html" <<HTMLEOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Index of /${dir}/</title></head>
          <body>
          <h1>Index of /${dir}/</h1>
          <hr><pre>
          <a href="../">../</a>
          HTMLEOF
            # Add each ZIP as a link (filename only — relative to this folder)
            (cd "dist/${dir}" && for f in *.zip; do
              [ -f "$f" ] && echo "<a href=\"$f\">$f</a>" >> "index.html"
            done)
            echo "</pre><hr></body></html>" >> "dist/${dir}/index.html"
          done

      - name: List dist contents
        run: find dist -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
